name: Python Tests

on:
  push:
    paths:
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/python-tests.yml"

  pull_request:
    paths:
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/python-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test release document builder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: pytest -v tests/test_build_release_docs.py